# ============================================================================
# columns.yaml - source -> canonical column map
# ============================================================================
# STATUS: DRAFT. Nothing is ingested until the owner approves this file
#         line by line (PLAN.md Checkpoint 2, gate G3).
#
# Drafted from reports/profiles/*.json (Wave 1), which were built from the
# spreadsheets themselves - not from guesses about the file names.
#
# HOW TO READ IT
#   layouts:  31 named table shapes. Each source column gets a role, or is
#             listed under `dropped`. Review these 31 blocks and you have
#             reviewed every column in the pack.
#
# VERIFY IT: `uv run python scripts/check_mapping.py` cross-checks every line
#            below against the Wave 1 profiles - files, sheets, header rows,
#            row counts and column accounting. It passes as of 29 Oct 2026.
#   files:    all 52 files, grouped by dealer, each pointing its sheet(s) at
#             a layout. Review these for "right dealer, right sheets".
#
# ROLES - only these six exist (src/pii.py KEEP_ROLES + TRANSIENT_ROLES):
#   date         -> feedback_date
#   department   -> department_raw   (normalised to Service/Sales/Parts in Wave 3)
#   rating       -> rating_raw + rating_1to5 (converted per rating_scale, D-020)
#   comment      -> comment          (redacted per D-026)
#   redact_name  -> transient: used to strip that row's own name from its comment,
#                   then discarded. Never written. (D-003 exception)
#   redact_rego  -> transient: same, for the registration plate
#
# redact_staff: NOT a role and NOT analysis data - the staff-name columns
#   ("Staff", "Taken by", "Logged by", "Card given by") are dropped from the
#   dataset like any other unmapped column. They are read in memory only, to
#   build the [STAFF] roster that strips staff names out of comments (D-026,
#   D-041). Nothing from them is ever written to disk.
#
# EVERYTHING ELSE IS DROPPED. `dropped:` is not instructions to the pipeline -
# the allowlist drops anything unmapped anyway (D-003). It is a completeness
# check: src/ingest.py asserts every column in the source appears either in
# `columns` or in `dropped`, so a new column in a re-sent file stops the run
# instead of being silently ignored.
#
# date_format: excel         real Excel date cells
#              excel_serial  Excel serial numbers stored as plain numbers
#              month_pivot   month labels like "Oct-25" (summary file only)
#              otherwise a strptime pattern, e.g. %d/%m/%Y
#
# rating_scale: one of the values in src/schema.py RatingScale.
#
# department_map: expands a source's own letter codes to the words they stand
#   for, before department_raw is written. Bendigo only (D-036). It is not the
#   Wave 3 normaliser - it just spells out what the site abbreviated.
# ============================================================================

version: 1
status: revised after the owner's review - Checkpoint 2 sign-off pending on the revisions
