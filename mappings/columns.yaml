# ---------------------------------------------------------------------------
# ROW ARITHMETIC the reconciliation report must reproduce (D-002 (c))
# ---------------------------------------------------------------------------
# Every number below was counted from the files on 29 Oct 2026, not estimated.
# Revised after the owner's review: the blank and "Total ..." rows that the
# draft left as "pilot" turned out to be OUTSIDE the profiled row counts
# already, so subtracting them again would have made the arithmetic fail to
# close. They are still counted and reported - see non_feedback_rows (D-039).
row_budget:
  source_rows_in_scope: 7162        # sum of expected_rows over the 51 ingested files

  excluded_whole_file:
    "Chermside Q1 2026 FINAL": 112  # D-027; not inside the 7162 above
  excluded_whole_sheet:
    "Penrith Jun 26": 43            # D-029
    "Southport Google reviews (copied)": 8   # D-032 #5

  pivot:
    toowoomba_summary_source_rows: 7   # 6 month x dept + 1 "Grand Total" row
    toowoomba_summary_expanded_rows: 71
    note: >
      The "Grand Total" row is one of the 7 and sums to 71 itself, so expanding
      it would double the quarter. Removing all 7 and adding the 71 handles it;
      it needs no separate drop line (D-039).

  # Rows the profiler already excluded when it reported data_rows, so they are
  # NOT inside source_rows_in_scope and must NOT be subtracted again. Counted
  # here because the reconciliation report still has to account for them and
  # the owner asked for them to be tagged "summary or notes" and dropped (D-039).
  non_feedback_rows_outside_the_count:
    blank: 14                       # Frankston 12 (7 + 5), Ringwood Q1 1, Shepparton 1
    total_rows: 12                  # Frankston's 12 monthly "Total <month>" rows
    note: 0 blank rows in any of the 15 CSVs; both counts verified 29 Oct 2026.

  # Rows that ARE inside source_rows_in_scope and have to be dropped.
  # Each row is counted once and once only.
  dropped_rows:
    no_rating: 10                   # Tamworth; blank rating, real comment (D-031)
    summary_or_note: 3              # D-039 + D-037
      # - Shepparton "Site closed 31/3/26 ... - Trish"   (xl row 55)
      # - Ringwood Q1 "*** NEW TEMPLATE FROM FEB 2026 ***" (xl row 36)
      # - Southport "asdf"                                (xl row 192)
    test_row: 3                     # Southport, D-032 #5 + D-037
      # - xl row 23  "TEST TEST",        dated 01/01/1900
      # - xl row 167 "testing new form", no date
      # - xl row 196 "test - ignore",    date reads "TEST"
    total: 16

  identity_the_pipeline_must_prove: >
    rows_out = 7162                     source rows in scope
             -   51                     excluded whole sheets
             -    7                     Toowoomba summary source rows
             +   71                     the rows those 7 expand into
             = 7175                     candidate rows
             -   16                     dropped rows, by reason, each counted once
             = 7159                     rows in data/interim/consolidated.parquet
  rows_out_expected: 7159

  per_dealer_checks:
    QLD07_rockhampton: 202            # from the North QLD split (D-042)
    QLD08_townsville: 354
    note: >
      24 dealers must appear. North QLD contributes two of them and its file name
      must appear as a dealership nowhere in the output.

  notes: >
    These are the numbers src/ingest.py must land on. Any difference is a bug in
    the mapping or in the code and blocks the merge (PLAN.md stop rules). The
    13 rows D-031 counted as "no rating" are the 10 Tamworth rows plus the three
    note/junk rows now reported under summary_or_note - the same 13 rows, split
    into reasons the owner asked for. None of the three Southport test rows is a
    no-rating row (all three carry a rating), so nothing is counted twice.
