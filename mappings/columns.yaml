      Dept: department
      "Rating (1-5)": rating
      Comments: comment
      Customer: redact_name
      Rego: redact_rego
    dropped: [Vehicle, "Action taken"]

  dandenong_may:                   # same table, one extra note row above it
    header_row: 5
    date_format: excel
    rating_scale: "1-5"
    columns:
