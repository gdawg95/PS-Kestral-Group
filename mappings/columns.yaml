      The extra row reads "NOTE: new online booking system went live 5 May.
      Expect some teething issues - log everything!". It carries no numbers, so
      nothing is lost by dropping it from the data. The owner asked to keep it
      as contextual evidence for the trend section (D-044), so it is recorded in
      reports/formatting_changes.md and must be cited if Dandenong dips in May.

