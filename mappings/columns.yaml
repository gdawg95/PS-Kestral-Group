      - summary_or_note            # 1 row, the "asdf" row (D-037, owner's call)
    # The only place in this repository where comment-column values are quoted.
    # These four are test strings with no personal content, and the owner needs
    # to see them to agree the rows are junk. Deliberate, bounded exception to
    # the profiling privacy rule; nothing else quotes a comment. (D-037)
    junk_rows:                     # verified cell by cell on 29 Oct 2026
      test_row:
        - {xl_row: 23,  date: 01/01/1900, dept: Parts,   rating: 1, comment: "TEST TEST"}
        - {xl_row: 167, date: null,       dept: Sales,   rating: 3, comment: "testing new form"}
        - {xl_row: 196, date: TEST,       dept: Service, rating: 5, comment: "test - ignore"}
      summary_or_note:
        - {xl_row: 192, date: asdf, dept: null, rating: null, comment: "asdf"}
    notes: >
      Row 167 is the row that had a rating but no date. Its comment reads
      "testing new form", so it is a test row, not lost feedback - the owner
      confirmed it on 29 Oct 2026 (D-037). All three test rows carry a rating,
      so none of them is also a D-031 no-rating row: no double counting.

  noosa:
    header_row: 1
    date_format: excel
    rating_scale: "1-5"
    columns:
      Date: date
      Department: department
      Rating: rating
      Comments: comment
    redact_staff: ["Card given by"]
    dropped: []
    notes: >
      49 rows for a full year, mean 4.63, cards handed out by staff. D-020 flags
      the likely selection bias for the report.

  toowoomba_2026:
    header_row: 1
    date_format: excel
    rating_scale: "1-5"
    columns:
      Date: date
      Department: department
      Rating: rating
      Comments: comment
    dropped: []

  toowoomba_summary:               # D-032 #1: counts, not rows
    header_row: 3
    date_format: month_pivot       # "Oct-25", "Nov-25", "Dec-25"
    rating_scale: pivot-1-5
    expand_pivot:
      month_column: Month
      department_column: Department
      count_columns: ["1", "2", "3", "4", "5"]
      day_of_month: 15             # mid-month, since the real day is unknown
      expected_rows: 71
      flag: from_summary
      comment: null                # no comments exist in a summary
    columns: {}                    # handled by expand_pivot, not by role mapping
    dropped: ["Grand Total"]
    drop_rows:
      - summary_or_note            # the "Grand Total" row at the bottom
    notes: >
      6 month x department rows summing to 71. Parts and Service only - Toowoomba
      logged no Sales feedback in Q4 2025. The owner took that at face value on
      29 Oct 2026 (D-038), so Toowoomba's Q4 2025 is reported as Service and
      Parts only, with a footnote. Excluded from NLP (no text).

  northqld:
    header_row: 1
    date_format: excel_serial
    rating_scale: "1-5"
    site_column: Site              # D-032 #6 / D-042: two dealers in one file
    split:                         # each row leaves as one dealer or the other
      QLD07: {name: Kestrel Rockhampton, expected_rows: 202}
      QLD08: {name: Kestrel Townsville,  expected_rows: 354}
    assert_split_counts: true      # 202 + 354 = 556; the run fails on any drift
    site_map:
      Rockhampton: QLD07
      Rocky: QLD07
      ROK: QLD07
      Townsville: QLD08
      TSV: QLD08
      Tsv: QLD08
    columns:
      Date: date
      Department: department
      Rating: rating
      Comments: comment
    dropped: []
    notes: >
      Verified 29 Oct 2026: exactly those 6 spellings, no others, across all four
      sheets. Split is 202 rows Rockhampton / 354 Townsville = 556. From here on
      the two sites are separate dealers everywhere - reconciliation, charts and
      the report - and the file name never appears as a dealership (D-042).

