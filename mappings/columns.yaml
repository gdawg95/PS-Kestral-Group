    notes: >
      Verified 29 Oct 2026: month-first parses 85/85 rows, all inside Jul-Sep 2026.
      Day-first parses only 29/85 and scatters them across the year. No ambiguity left.

  wollongong:
    header_row: 1
    csv: {delimiter: ",", encoding: cp1252}   # NOT utf-8 - see notes (D-043)
    date_format: "%d-%b-%y"
    rating_scale: "1-5"
    columns:
      Date: date
      Dept: department
      Rating: rating
      "Customer feedback": comment
      Name: redact_name
    dropped: [Mobile]
    notes: >
      Both Wollongong files are Windows-1252, not UTF-8 (found 29 Oct 2026: byte
      0x92, a curly apostrophe, inside the comment column of each file - at
      offset 431 in the Apr-Sep file and 402 in the Oct-Mar one). Reading them as
      UTF-8 raises UnicodeDecodeError, and forcing it past that would mangle the
      apostrophes in the comments that then go to the NLP. D-043.

  tamworth:
    header_row: 1
    date_format: "%d/%m/%Y"
    rating_scale: words-3          # D-020: Bad 1 / OK 3 / Good 5
    columns:
