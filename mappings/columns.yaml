      Department: department
      Rating: rating
      Comments: comment
      Name: redact_name
    dropped: [Mobile, Email]

  ips:
    header_row: 1
    date_format: "%d/%m/%Y"
    rating_scale: "1-5"
    columns:
      Date: date
      Dept: department
      Rating: rating
      Notes: comment
    redact_staff: ["Logged by"]
    dropped: [Site]
    date_fixes:
      approximate:                 # D-032 #4 / D-040: owner approved 29 Oct 2026
        count: 10                  # the only 10 non-date values in the column
        values: ["early Oct", "mid Nov", "early Jan", "wk1 Feb", "wk5 Mar",
                 "early Apr", "mid Jun", "Aug?", "Aug?", "mid Sep"]
        action: >
          The log is in date order, so the day is the midpoint of the nearest
          dated row above and the nearest below, and the year comes with them.
          The label supplies the month.
        cross_check: >
          The imputed day must land inside the month the label names, or the run
          fails. Verified by hand for all 10 rows on 29 Oct 2026 - it holds for
          every one, so no monthly figure depends on which signal we trust.
        flag: date_approx
    notes: >
      `Site` is "KMG-IPS" on all 277 rows, so it is dropped rather than used as a
      site column. Confirms one site per file (see D-034).

  southport:
    header_row: 1
    date_format: excel
    rating_scale: "1-5"
    columns:
