layouts:

  # --- VIC ----------------------------------------------------------------

  ballarat:
    header_row: 2                  # two-row header: group labels sit above the names
    date_format: excel
    rating_scale: words-5          # Very dissatisfied .. Very satisfied (D-020)
    columns:
      Date: date
      Dept: department
      "How satisfied?": rating
      Comments: comment
      Name: redact_name
    dropped: [Phone]
    notes: 3 merged cell ranges in the header area; the data itself is not merged.

  dandenong:
    header_row: 4                  # 3 title/note rows above the header
    date_format: excel
    rating_scale: "1-5"
    columns:
