    date_format: excel
    rating_scale: "1-5"
    columns:
      Date: date
      Area: department
      Rating: rating
      Comments: comment
    dropped: []
    unnamed_columns: drop          # 3 empty columns to the right of Comments
    drop_rows:
      - blank
      - summary_or_note            # D-032 #10: 12 monthly "Total ..." rows

  frankston_v2:
    header_row: 160                # D-032 #10: the layout changes mid-sheet
    date_format: excel
    rating_scale: "1-5"
    columns:
