    columns:
      Date: date
      Department: department
      Rating: rating
      Feedback: comment
      Customer: redact_name
    dropped: []
    notes: The reversal applies to THIS sheet only. tests/test_ingest.py must assert that.

  geelong_2026:
    header_row: 4
    date_format: "%d/%m/%y"
    rating_scale: "1-5"            # sheet title: new head office scale
    columns:
      Date: date
      Department: department
      Rating: rating
      Feedback: comment
      Customer: redact_name
    dropped: []

  ringwood_5pt:
    header_row: 1
    date_format: "%d/%m/%Y"
    rating_scale: "1-5"
    columns:
      "Date Received": date
      Department: department
      "Score (1-5)": rating
      "Customer comments": comment
    dropped: ["Followed up?"]
    unnamed_columns: drop          # 2 empty columns in Q1 2026
    drop_rows:
      - blank
