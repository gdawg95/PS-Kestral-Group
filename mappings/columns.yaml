      - summary_or_note            # "Site closed 31/3/26 ... - Trish" (D-031)

  bendigo:
    header_row: 1
    csv: {delimiter: ",", encoding: utf-8-sig}   # byte-order mark on the header
    date_format: "%d %b %y"
    rating_scale: stars-5          # D-020: count the filled stars
    columns:
      Date: date
      Dept: department
      Stars: rating
      "What did they say?": comment
    dropped: []
    department_map:                 # D-036: owner confirmed 29 Oct 2026
      SV: Service
      S: Sales
      P: Parts
    notes: >
      The only file that codes departments as letters. The owner confirmed the
      meanings and asked for the words to be spelled out, so department_raw
      holds "Service" / "Sales" / "Parts" here, not "SV" / "S" / "P". The
      source letter stays recoverable from source_file + source_row.

  boxhill:
    header_row: 1
    csv: {delimiter: ",", encoding: utf-8}
    date_format: "%Y-%m-%d %H:%M:%S"
    rating_scale: "1-5"
    columns:
