    date_format: "%d/%m/%Y"
    rating_scale: "1-10"
    columns:
      Date: date
      Department: department
      "Score (out of 10)": rating
      "Customer comments": comment
    redact_staff: [Staff]
    dropped: [Model, "Follow up (Y/N)"]

  shepparton:
    header_row: 1
    date_format: "%d/%m/%Y"
    rating_scale: "1-5"
    columns:
      Date: date
      Dept: department
      Rating: rating
      Comment: comment
