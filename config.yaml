# Single source for paths, seeds, thresholds and model versions.
# Thresholds marked TBD are set and committed by the owner before results come in (gate G7).

paths:
  raw: data/raw
  interim: data/interim
  clean: data/clean
  llm_cache: data/llm_cache
  profiles: reports/profiles
  figures: reports/figures
  mappings: mappings/columns.yaml
  dealerships: data/raw/reference/dealerships.csv
  revenue: data/raw/reference/monthly_revenue.csv

seed: 42

models:
  spacy: en_core_web_sm          # PII name detection (D-026)
  sentiment: cardiffnlp/twitter-roberta-base-sentiment-latest   # laptop only (D-013)
  embeddings: sentence-transformers/all-MiniLM-L6-v2            # laptop only (D-013)
  llm:
    name: qwen2.5:3b
    ollama_model_id: 357c53fb659c
    image: ollama/ollama@sha256:20d1bbfbabe1c97ba4b16301f08a20d8484bcf77047742a3cb71c613d8e12d0b
    host: http://localhost:11434
    timing_check: "12.83 tokens/s on CPU, 29 Oct 2026 (one-sentence test)"

thresholds:
  negative_score_max_1to5: 2        # D-004 (provisional)

  # Retired, not set: `dealer_match_min_confidence` was the fuzzy-match confidence floor
  # for PLAN.md's Wave 3 "dealership matching" agent, which turned out to have nothing to
  # match. D-034 approved the file -> dealer code map by hand and no free-text dealership
  # column survives ingestion (D-003), so there are no names to score. See D-050.

  # What counts as a real month-on-month move (D-052, closes D-021). Evidence:
  # reports/trend_evidence.md - ratings have SD 1.44, so a change between two 20-response
  # months carries +/-0.46 of noise. 0.5 sits just outside that; 20 responses or more is
  # 74% of dealer-months. This rule calls 33 of 257 month pairs a trend, at 16 of 24 sites.
  trend_evidence:
    min_month_responses: 20         # below this, report the month as a count, never a move
    min_change_1to5: 0.5            # smallest change reported as a trend
    thin_dealer_basis: quarterly    # NSW07, QLD05, QLD07, VIC08, VIC09: median month < 20

  # The NLP pass mark (D-055, closes D-022). Evidence:
  # reports/nlp_pass_mark_evidence.md - commented rows are 59.3% positive, so a model that
  # answers "positive" every time scores 59.3% raw agreement but kappa = 0. This supersedes
  # the ">= 80% on 100 comments" default proposed in agents/briefs/w3_validate.md Q4.
  nlp_pass_mark:
    metric: cohens_kappa            # chance-corrected agreement, not raw agreement
    sentiment_min_kappa: 0.60       # 3-class sentiment; always-positive model scores 0
    sample_size: 150                # +/-6.4pp at 95%; 100 comments gives +/-7.8pp
    sample_stratified: true         # ~50/50/50 by score class, weighted back for headlines
    theme_bar: TBD                  # share of assignments judged defensible; set once the
                                    # theme list is fixed (D-023)
    fallback: score_only            # kappa < 0.60 -> D-004's rating is primary and
                                    # sentiment is reported as a method comparison
  llm_max_projected_hours: 2        # D-011 cut-off rule
